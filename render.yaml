services:
  - type: web
    name: edgar-query
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SEC_CONTACT
        sync: false          # set in the Render dashboard, not in git
      - key: PYTHON_VERSION
        value: "3.12.0"
