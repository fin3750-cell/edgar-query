services:
  - type: web
    name: edgar-query
    runtime: python
    # Workspace billing: Render Pro plan ($25/mo, up to 25 services), set in the
    # Render dashboard, not in this file. `plan:` below is only the instance type.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SEC_CONTACT
        sync: false          # set in the Render dashboard, not in git
      - key: PYTHON_VERSION
        value: "3.12.0"
